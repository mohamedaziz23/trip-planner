# Local MongoDB as a single-node replica set (required for multi-document transactions).
services:
  mongo:
    image: mongo:7
    container_name: trip-planner-mongo
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: >
        echo "try { rs.status() } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: '127.0.0.1:27017' }] }) }"
        | mongosh --port 27017 --quiet
      interval: 5s
      timeout: 10s
      start_period: 5s
      retries: 30

volumes:
  mongo-data:
